<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="theme-color" content="#0f766e" />
        <title>Sedang offline · ProjectSOA</title>
        <link rel="stylesheet" href="/assets/app.v1.css" />
        <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    </head>
    <body>
        <main class="main-content">
            <section class="panel error-panel">
                <img
                    class="app-icon"
                    src="/icons/icon-192.png"
                    width="72"
                    height="72"
                    alt="ProjectSOA"
                />
                <p class="eyebrow">Koneksi terputus</p>
                <h1>Anda sedang offline.</h1>
                <p>
                    Sambungkan kembali ke internet untuk membuka catatan dan
                    menyimpan perubahan.
                </p>
                <p class="small">
                    Data keuangan tidak disimpan di cache aplikasi. Tidak ada
                    perubahan yang dikirim otomatis saat jaringan kembali.
                </p>
                <a class="button" href="/">Coba kembali</a>
            </section>
        </main>
    </body>
