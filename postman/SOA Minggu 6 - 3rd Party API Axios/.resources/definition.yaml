description: |-
  # SOA Minggu 6 — Koleksi Praktikum (3rd Party API dengan Axios)

  Endpoint buku tidak berubah dari Minggu 2-5. Yang baru: service kita juga menjadi CLIENT — memanggil API pihak ketiga (Kitsu) lewat axios, meresponse-nya sesuai KONTRAK kita sendiri, dan gagal dengan sopan saat upstream gagal (504 timeout, 502 upstream error, 429 rate limit diteruskan).

  Folder **5 - ContohAxios** berisi 4 request baru.

  ## Menjalankan

  ```bash
  cd w6
  npm install
  cp .env.example .env
  npm run db:migrate
  npm run dev
  ```

  Lalu Run koleksi ini dengan environment `local`. Butuh koneksi internet untuk folder ContohAxios — upstream-nya Kitsu.
