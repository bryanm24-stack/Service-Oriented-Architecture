$kind: http-request
description: "Joi.ref(): konfirmasi dibandingkan dengan field password lain. Error jatuh di field konfirmasi."
url: "{{baseUrl}}/contoh/validasi"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "pengguna_username": "jotaro",
      "pengguna_email": "jotaro@istts.edu",
      "pengguna_password": "Kujo1234!",
      "pengguna_konfirmasi_password": "beda1234!",
      "pengguna_birthday": "1990-05-10"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400', () => pm.response.to.have.status(400));
      pm.test('pesan harus sama dengan password', () => pm.expect(pm.response.json().errors.pengguna_konfirmasi_password[0]).to.include('sama dengan password'));
    language: text/javascript
order: 4000
