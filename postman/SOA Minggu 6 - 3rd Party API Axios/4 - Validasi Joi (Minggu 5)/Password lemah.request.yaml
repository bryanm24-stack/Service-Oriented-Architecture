$kind: http-request
description: Regex kekuatan password gagal -> pesan `.messages` custom, bukan pesan default Joi.
url: "{{baseUrl}}/contoh/validasi"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "pengguna_username": "jotaro",
      "pengguna_email": "jotaro@istts.edu",
      "pengguna_password": "abc",
      "pengguna_konfirmasi_password": "abc",
      "pengguna_birthday": "1990-05-10"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400', () => pm.response.to.have.status(400));
      pm.test('pesan strength password', () => pm.expect(pm.response.json().errors.pengguna_password[0]).to.include('1 huruf kecil'));
    language: text/javascript
order: 3000
