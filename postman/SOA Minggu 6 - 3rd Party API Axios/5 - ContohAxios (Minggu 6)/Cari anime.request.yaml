$kind: http-request
description: "Query diteruskan ke upstream: ?q=jojo&limit=3. Response memuat HANYA delapan field kontrak kita — synopsis, studio, dan puluhan field lain milik upstream TIDAK ikut. Tanpa `q`, endpoint mengembalikan anime paling populer."
url: "{{baseUrl}}/contohAxios?q=jojo&limit=3"
method: GET
queryParams:
  q: jojo
  limit: "3"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('envelope total+data', () => {
        const b = pm.response.json();
        pm.expect(b).to.have.property('total');
        pm.expect(b.data).to.be.an('array');
      });
      pm.test('total sesuai jumlah data', () => {
        pm.expect(pm.response.json().data.length).to.eql(pm.response.json().total);
      });
    language: text/javascript
order: 1000
