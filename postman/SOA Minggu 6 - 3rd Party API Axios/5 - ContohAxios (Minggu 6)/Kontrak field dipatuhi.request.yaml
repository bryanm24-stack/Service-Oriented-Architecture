$kind: http-request
description: Setiap item HANYA punya delapan field kontrak. Ini test yang akan merah suatu hari kalau ada yang meneruskan payload upstream mentah.
url: "{{baseUrl}}/contohAxios?q=jojo&limit=1"
method: GET
queryParams:
  q: jojo
  limit: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('hanya field kontrak', () => {
        const item = pm.response.json().data[0];
        pm.expect(item).to.have.all.keys('mal_id','url','title','trailer','type','episodes','status','rating');
      });
      pm.test('payload upstream tidak bocor', () => {
        pm.expect(pm.response.json().data[0]).to.not.have.property('synopsis');
        pm.expect(pm.response.json().data[0]).to.not.have.property('studios');
      });
    language: text/javascript
order: 2000
