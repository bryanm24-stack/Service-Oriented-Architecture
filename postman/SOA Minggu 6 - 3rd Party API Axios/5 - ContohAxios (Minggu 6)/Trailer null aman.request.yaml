$kind: http-request
description: "Beberapa anime tidak punya trailer. Tanpa optional chaining, item itu menjadi 500 'Cannot read property url of null'. Di sini: trailer null atau string, tidak pernah error."
url: "{{baseUrl}}/contohAxios?q=naruto&limit=10"
method: GET
queryParams:
  q: naruto
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('trailer null atau string', () => {
        pm.response.json().data.forEach(item => {
          pm.expect(item.trailer === null || typeof item.trailer === 'string').to.be.true;
        });
      });
    language: text/javascript
order: 3000
